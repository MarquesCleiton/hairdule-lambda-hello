name: Deploy Homol (SAM)

on:
  push:
    branches: [homol]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: homol

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: SAM Build
        run: sam build --template-file infra/template.yaml

      - name: SAM Deploy (homol)
        run: sam deploy --config-env homol --no-confirm-changeset --no-fail-on-empty-changeset
